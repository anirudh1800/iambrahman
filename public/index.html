<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I am Brahman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,600;1,300&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ash:      #ffffff;
    --ink:      #ffffff;
    --ink-soft: #ffffff;
    --kumkum:   #A8322D;
    --rule:     #BFC4BB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background-color: var(--ash);
    background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('/images/Gemini_Generated_Image_kbb2e1kbb2e1kbb2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: Spectral, Georgia, serif;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.5);
  }

  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    padding: 1.4rem 1.6rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.35rem;
  }

  h1 {
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .om {
    color: var(--kumkum);
    font-size: 1em;
  }

  .hint { margin: 0.9rem 0 0; font-size: 0.78rem; color: var(--ink-soft); }

  main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }

  .markmap { position: relative; height: 100%; }
  .markmap > svg { width: 100%; height: 100%; }

  .markmap-foreign {
    font-family: Spectral, Georgia, serif;
    font-size: 15px;
    color: var(--ink);
  }
  .markmap-foreign em { color: var(--ink-soft); }

  @media (max-width: 640px) {
    header { padding: 1rem 1.1rem 0.85rem; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Aspect · Shape · Form</p>
  <h1><span class="om" aria-hidden="true">ॐ</span>I am Brahman <span class="om" aria-hidden="true">ॐ</span></h1>
  <p class="hint">Click a node to fold or unfold · drag to pan · scroll to zoom</p>
</header>

<main>
  <div class="markmap">
    <script type="text/template">

    }

# I am Brahman
## I am Shiva

### I am Rudra
#### Shruti & Mantra
##### Vedic Recitation · ~460 vv.
- Sri Rudram — Namakam & Chamakam, ~300 mantras (Taittiriya Samhita 4.5, 4.7)
- Rudrashtadhyayi — 8 adhyayas, Shukla Yajurveda recension
#### Ritual Verse
##### Kavacham · ~36 vv.
- Rudra Kavacham — ~36 vv., anga-nyasa protection
#### Stotra
##### Ashtakam (count) · 8 vv.
- Rudrashtakam — 8 vv., *Namamisham ishana nirvanarupam*

### I am Mrityunjaya
#### Shruti & Mantra
##### Mantra · 1 v.
- Maha Mrityunjaya — *Tryambakam yajamahe* (Rigveda 7.59.12)
#### Ritual Verse
##### Kavacham · ~30 vv.
- Mrityunjaya Kavacham — ~30 vv.
#### Stotra
##### Stotram (free length) · ~9 vv.
- Mrityunjaya Stotram — ~9 vv., Markandeya

### I am Bhairava
#### Ritual List
##### Namavali · 108 names
- Bhairava Ashtottara Shatanamavali — 108 names, arcana
#### Stotra
##### Ashtakam (count) · 8(9) vv.
- Kalabhairava Ashtakam — 8(9) vv., *Devaraja sevyamana*
##### Stotram (free length) · ~10 vv.
- Batuka Bhairava Stotram — ~10 vv.

### I am Nataraja
#### Ritual Verse
##### Dhyana Shloka · 1 v.
- *Nrittavasane* — Chidambaram dhyana
#### Stotra
##### Ashtakam (count) · 8 vv.
- Nataraja Ashtakam — 8 vv.
##### Stotram (free length) · ~25 vv.
- Nataraja Stotram — ~9 vv., *Sadanchita*, attr. Patanjali
- Shiva Tandava Stotram — 16(17) vv., *Jatatavi galajjala*

### I am Dakshinamurti
#### Shruti & Mantra
##### Mantra · 1 v.
- Medha Dakshinamurti Mantra
#### Ritual Verse
##### Dhyana Shloka · 1 v.
- *Mauna vyakhya prakatita*
#### Stotra
##### Stotram (free length) · ~14 vv.
- Dakshinamurti Stotram — 10 vv. + 4 dhyana vv.

### I am Linga
#### Stotra
##### Ashtakam (count) · ~17 vv.
- Lingashtakam — 8 vv., *Brahma murari surarchita*
- Bilvashtakam — 8(9) vv., bilva-leaf offering hymn

### I am Ardhanarishvara
#### Stotra
##### Stotram (free length) · 18 vv.
- Ardhanarishvara Stotram — 9 vv., *Champeya gaurardha*
- Ardhanari Nateshvara Stotram — 9 vv.

### I am Nirguna
#### Stotra
##### Shatkam (count) · 6 vv.
- Nirvana Shatkam — 6 vv., *Shivoham shivoham*
##### Stotram (free length) · ~32 vv.
- Shiva Manasa Puja — 5 vv.
- Vedasara Shiva Stotram — 11 vv.
- Shivaparadha Kshamapana Stotram — ~16 vv.
##### Lahari (style) · 100 vv.
- Shivananda Lahari — 100 vv., stotra-kavya

### I am All Forms
#### Shruti & Mantra
##### Mantra · 5 syllables
- Panchakshara — *Om Namah Shivaya*
#### Ritual List
##### Namavali · 1108 names
- Shiva Ashtottara Shatanamavali — 108 names
- Shiva Sahasranama Namavali — 1000 names, unmetered arcana list
#### Ritual Verse
##### Dhyana Shloka · 1 v.
- Karpur Gauram — 1 v.
#### Stotra
##### Panchakam (count) · 5(6) vv.
- Shiva Panchakshara Stotram — 5(+1) vv., one per syllable
##### Bhujanga Prayata (meter) · ~13 vv.
- Shiva Bhujanga Prayata Stotram — ~13 vv.
##### Stotram (free length) · ~233 vv.
- Shiva Mahimnah Stotram — 43 vv., Pushpadanta
- Shiva Sahasranama Stotram — ~190 vv., anushtubh

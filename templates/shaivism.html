<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiva Sutras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ash:      #ffffff;
    --ink:      #ffffff;
    --ink-soft: #ffffff;
    --kumkum:   #A8322D;
    --rule:     #BFC4BB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background-color: var(--ash);
    background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('/images/Gemini_Generated_Image_kbb2e1kbb2e1kbb2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: Spectral, Georgia, serif;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.5);
  }

  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    padding: 1.4rem 1.6rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.35rem;
  }

  h1 {
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .om {
    color: var(--kumkum);
    font-size: 1em;
  }

  .tabs {
    display: flex;
    gap: 1.4rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }

  .tabs a {
    display: inline-block;
    padding: 0.3rem 0.1rem 0.5rem;
    font-family: Spectral, Georgia, serif;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tabs a.active {
    color: var(--ink);
    border-bottom-color: var(--kumkum);
  }

  main {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    padding: 2.2rem 1.6rem 4rem;
  }

  .prose {
    width: 100%;
    max-width: 42rem;
    font-size: 1.05rem;
    line-height: 1.75;
    background: rgba(20, 16, 14, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 1.8rem 2.2rem;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }

  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-weight: 600;
    line-height: 1.25;
    margin: 2rem 0 0.8rem;
  }
  .prose h1 { font-size: 1.9rem; }
  .prose h2 { font-size: 1.5rem; }
  .prose h3 { font-size: 1.2rem; }
  .prose h4 { font-size: 1.05rem; }
  .prose h1:first-child, .prose h2:first-child { margin-top: 0; }

  .prose p { margin: 0 0 1.1rem; }
  .prose ul, .prose ol { margin: 0 0 1.1rem; padding-left: 1.4rem; }
  .prose li { margin: 0.3rem 0; }
  .prose blockquote {
    margin: 0 0 1.1rem;
    padding: 0.2rem 1rem;
    border-left: 2px solid var(--kumkum);
    color: var(--ink-soft);
    font-style: italic;
  }
  .prose code {
    font-family: 'IBM Plex Sans', monospace;
    font-size: 0.9em;
    background: rgba(255, 255, 255, 0.12);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  .prose pre {
    background: rgba(0, 0, 0, 0.35);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  .prose pre code { background: none; padding: 0; }
  .prose a { color: var(--ink); text-decoration-color: var(--kumkum); }
  .prose hr { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }

  @media (max-width: 640px) {
    header { padding: 1rem 1.1rem 0.85rem; }
    main { padding: 1.6rem 1.1rem 3rem; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Aspect · Shape · Form</p>
  <h1><span class="om" aria-hidden="true">ॐ</span>I am Brahman <span class="om" aria-hidden="true">ॐ</span></h1>
  <ul class="tabs">
    <li><a href="/">Yatra</a></li>
    <li><a href="/shaivism.html" class="active">Shiva Sutras</a></li>
  </ul>
</header>

<main>
  <article class="prose" id="content"></article>
</main>

<script type="text/template" id="markdown-source">
{{MARKDOWN_CONTENT}}
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/lib/marked.umd.min.js"></script>
<script>
  const raw = document.getElementById('markdown-source').textContent;
  document.getElementById('content').innerHTML = marked.parse(raw);
</script>

</body>
</html>

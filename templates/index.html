<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I am Brahman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,600;1,300&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ash:      #ffffff;
    --ink:      #ffffff;
    --ink-soft: #ffffff;
    --kumkum:   #A8322D;
    --rule:     #BFC4BB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background-color: var(--ash);
    background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('/images/Gemini_Generated_Image_kbb2e1kbb2e1kbb2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: Spectral, Georgia, serif;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.5);
  }

  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    padding: 1.4rem 1.6rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.35rem;
  }

  h1 {
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .om {
    color: var(--kumkum);
    font-size: 1em;
  }

  .hint { margin: 0.9rem 0 0; font-size: 0.78rem; color: var(--ink-soft); }

  main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }

  .markmap { position: relative; height: 100%; }
  .markmap > svg { width: 100%; height: 100%; }

  .markmap-foreign {
    font-family: Spectral, Georgia, serif;
    font-size: 15px;
    color: var(--ink);
  }
  .markmap-foreign em { color: var(--ink-soft); }

  @media (max-width: 640px) {
    header { padding: 1rem 1.1rem 0.85rem; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Aspect · Shape · Form</p>
  <h1><span class="om" aria-hidden="true">ॐ</span>I am Brahman <span class="om" aria-hidden="true">ॐ</span></h1>
  <p class="hint">Click a node to fold or unfold · drag to pan · scroll to zoom</p>
</header>

<main>
  <div class="markmap">
    <script type="text/template">
{{MARKMAP_CONTENT}}
    </script>
  </div>
</main>

<script>
  window.markmap = {
    /** @type AutoLoaderOptions */
    autoLoader: {
      toolbar: true,
      onReady: () => {
        // A click opens a node's entire subtree, not one level at a time.
        // Ctrl+click (Cmd on Mac) inverts this, stepping down one level.
        window.markmap.defaultOptions.toggleRecursively = false;
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18"></script>

</body>
</html>
